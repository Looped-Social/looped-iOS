name: iOS Tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  unit-tests:
    name: Unit Tests (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick available iPhone simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          preferred=("iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15")
          sim_name=""
          for name in "${preferred[@]}"; do
            if xcrun simctl list devices available | grep -F "$name" >/dev/null 2>&1; then
              sim_name="$name"
              break
            fi
          done
          if [[ -z "$sim_name" ]]; then
            sim_name="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          fi
          if [[ -z "$sim_name" ]]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi
          echo "sim_name=$sim_name" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $sim_name"

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          LOOPED_BLOCK_NETWORK_IN_TESTS=1 xcodebuild test \
            -project looped-iOS.xcodeproj \
            -scheme "looped-iOS" \
            -destination "platform=iOS Simulator,OS=latest,name=${{ steps.sim.outputs.sim_name }}" \
            -only-testing:looped-iOSTests \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

  ui-tests:
    name: UI Tests (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick available iPhone simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          preferred=("iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15")
          sim_name=""
          for name in "${preferred[@]}"; do
            if xcrun simctl list devices available | grep -F "$name" >/dev/null 2>&1; then
              sim_name="$name"
              break
            fi
          done
          if [[ -z "$sim_name" ]]; then
            sim_name="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          fi
          if [[ -z "$sim_name" ]]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi
          echo "sim_name=$sim_name" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $sim_name"

      - name: Run UI tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project looped-iOS.xcodeproj \
            -scheme "looped-iOS Staging" \
            -destination "platform=iOS Simulator,OS=latest,name=${{ steps.sim.outputs.sim_name }}" \
            -only-testing:looped-iOSUITests \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath UITestResults.xcresult

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results
          path: UITestResults.xcresult
          if-no-files-found: ignore
